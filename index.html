<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Кардон PRO — Калькулятор</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #05070c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            background-image:
                radial-gradient(ellipse 800px 500px at 15% 0%, rgba(56, 189, 148, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 800px 500px at 90% 100%, rgba(56, 130, 246, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse 1000px 700px at 50% 50%, rgba(20, 24, 34, 0.4) 0%, transparent 70%);
            background-color: #05070c;
        }

        /* ===== MAIN CARD ===== */
        .card {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(180deg, rgba(22, 27, 40, 0.9) 0%, rgba(14, 18, 28, 0.9) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 28px;
            padding: 28px 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                0 30px 60px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 1px 0 rgba(255, 255, 255, 0.06) inset;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 148, 0.5), rgba(56, 130, 246, 0.5), transparent);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #38bd94, #2d9d7a);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: 0 6px 18px rgba(56, 189, 148, 0.3);
            flex-shrink: 0;
        }

        .logo-text {
            color: #f4f6fb;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.6px;
            line-height: 1.1;
        }

        .logo-text span {
            color: #38bd94;
        }

        .logo-sub {
            display: block;
            color: rgba(255, 255, 255, 0.32);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .badge {
            background: rgba(56, 189, 148, 0.1);
            border: 1px solid rgba(56, 189, 148, 0.25);
            color: #4fd8ac;
            font-size: 10px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 8px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ===== MODE TOGGLE ===== */
        .mode-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 4px;
            margin: 22px 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.2px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #38bd94, #2a9c7c);
            color: #06120e;
            box-shadow: 0 4px 16px rgba(56, 189, 148, 0.35);
        }

        .mode-btn:not(.active):hover {
            color: rgba(255, 255, 255, 0.75);
        }

        /* ===== INPUTS ===== */
        .input-group {
            background: rgba(255, 255, 255, 0.025);
            border-radius: 14px;
            padding: 13px 16px 11px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.055);
            transition: border-color 0.25s ease, background 0.25s ease;
            position: relative;
            z-index: 1;
        }

        .input-group:focus-within {
            border-color: rgba(56, 189, 148, 0.45);
            background: rgba(56, 189, 148, 0.04);
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.36);
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .input-group label .label-icon {
            font-size: 13px;
            opacity: 0.9;
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 4px 0 2px;
            color: #f4f6fb;
            font-size: 24px;
            font-weight: 700;
            outline: none;
            letter-spacing: -0.3px;
            font-variant-numeric: tabular-nums;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.12);
            font-weight: 500;
            font-size: 19px;
        }

        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-group input[type=number] {
            -moz-appearance: textfield;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-row .input-group {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        /* ===== RESULTS ===== */
        .result-box {
            background: rgba(0, 0, 0, 0.28);
            border-radius: 18px;
            padding: 6px 18px;
            margin: 18px 0 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 10px;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            color: rgba(255, 255, 255, 0.42);
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 9px;
            white-space: nowrap;
        }

        .result-label .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .result-label .dot.buy {
            background: #4a7cf7;
            box-shadow: 0 0 8px rgba(74, 124, 247, 0.6);
        }
        .result-label .dot.sell {
            background: #e6b91e;
            box-shadow: 0 0 8px rgba(230, 185, 30, 0.6);
        }
        .result-label .dot.profit {
            background: #38bd94;
            box-shadow: 0 0 8px rgba(56, 189, 148, 0.6);
        }
        .result-label .dot.total {
            background: #f27d9a;
            box-shadow: 0 0 8px rgba(242, 125, 154, 0.6);
        }

        .result-value {
            color: #f4f6fb;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.2px;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .result-row.emphasis {
            background: rgba(56, 189, 148, 0.06);
            margin: 0 -18px;
            padding: 14px 18px;
            border-radius: 14px;
        }

        .result-row.emphasis .result-value {
            font-size: 20px;
        }

        .result-value.green {
            color: #4fd8ac;
        }
        .result-value.gold {
            color: #f0c94a;
        }
        .result-value.pink {
            color: #f5a0b8;
        }
        .result-value.blue {
            color: #7ba8fa;
        }
        .result-value.red {
            color: #f27d7d;
        }
        .result-value.gray {
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== BUTTON ===== */
        .clear-btn {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.45);
            font-weight: 600;
            padding: 15px 0;
            width: 100%;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .clear-btn:active {
            transform: scale(0.98);
        }

        /* ===== FOOTER ===== */
        .footer-meta {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.16);
            margin-top: 16px;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
        }

        /* ===== RESPONSIVE / MOBILE ===== */
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .card {
                max-width: 100%;
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
                padding: 20px 18px 28px;
                border: none;
                box-shadow: none;
            }

            .logo-icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
                border-radius: 11px;
            }

            .logo-text {
                font-size: 18px;
            }

            .logo-sub {
                font-size: 10px;
            }

            .badge {
                font-size: 9px;
                padding: 4px 9px;
            }

            .mode-toggle {
                margin: 18px 0 16px;
            }

            .mode-btn {
                padding: 11px 0;
                font-size: 13.5px;
            }

            .input-row {
                flex-direction: column;
                gap: 0;
            }

            .input-row .input-group {
                margin-bottom: 10px;
            }

            .input-group input {
                font-size: 22px;
            }

            .input-group input::placeholder {
                font-size: 18px;
            }

            .result-box {
                padding: 4px 14px;
                margin: 16px 0;
            }

            .result-row {
                padding: 12px 0;
            }

            .result-row.emphasis {
                margin: 0 -14px;
                padding: 13px 14px;
            }

            .result-label {
                font-size: 12.5px;
            }

            .result-value {
                font-size: 16.5px;
            }

            .result-row.emphasis .result-value {
                font-size: 19px;
            }

            .clear-btn {
                padding: 16px 0;
                font-size: 14.5px;
            }
        }

        @media (max-width: 340px) {
            .logo-text {
                font-size: 16px;
            }
            .input-group input {
                font-size: 20px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 148, 0.35);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🛞</div>
            <div>
                <div class="logo-text">Кардон<span>PRO</span></div>
                <span class="logo-sub">Профессиональный расчёт</span>
            </div>
        </div>
        <div class="badge">⚡ v2.0</div>
    </div>

    <!-- MODE TOGGLE -->
    <div class="mode-toggle">
        <button class="mode-btn active" data-mode="kg">По кило</button>
        <button class="mode-btn" data-mode="pcs">Поштучно</button>
    </div>

    <!-- INPUTS -->
    <div id="inputsArea">
        <div class="input-row">
            <div class="input-group">
                <label><span class="label-icon">💰</span> Закуп (за 1 кг)</label>
                <input type="number" step="0.01" id="kgBuy" placeholder="0.00">
            </div>
            <div class="input-group">
                <label><span class="label-icon">🏷️</span> Продажа (за 1 кг)</label>
                <input type="number" step="0.01" id="kgSell" placeholder="0.00">
            </div>
        </div>
        <div class="input-group">
            <label><span class="label-icon">⚖️</span> Вес (килограмм)</label>
            <input type="number" step="0.01" id="kgWeight" placeholder="Например 10">
        </div>
    </div>

    <!-- RESULTS -->
    <div class="result-box">
        <div class="result-row">
            <span class="result-label"><span class="dot buy"></span> Закуп (сомони)</span>
            <span class="result-value blue" id="buyPrice">0.00</span>
        </div>
        <div class="result-row">
            <span class="result-label"><span class="dot sell"></span> Продажа (сомони)</span>
            <span class="result-value gold" id="sellPrice">0.00</span>
        </div>
        <div class="result-row">
            <span class="result-label"><span class="dot profit"></span> Фойда / Прибыль</span>
            <span class="result-value green" id="profit">0.00</span>
        </div>
        <div class="result-row emphasis">
            <span class="result-label"><span class="dot total"></span> Итог клиенту</span>
            <span class="result-value pink" id="clientTotal">0.00</span>
        </div>
    </div>

    <!-- BUTTON -->
    <button class="clear-btn" id="resetBtn">⟳ Очистить всё</button>
    <div class="footer-meta">Данные сохраняются автоматически · Сомони</div>
</div>

<script>
    (function() {
        let currentMode = 'kg';

        let state = {
            kgBuy: '',
            kgSell: '',
            kgWeight: '',
            pcsBuy: '',
            pcsSell: '',
            pcsCount: ''
        };

        const inputsArea = document.getElementById('inputsArea');
        const modeBtns = document.querySelectorAll('.mode-btn');

        const elBuyPrice = document.getElementById('buyPrice');
        const elSellPrice = document.getElementById('sellPrice');
        const elProfit = document.getElementById('profit');
        const elClientTotal = document.getElementById('clientTotal');
        const resetBtn = document.getElementById('resetBtn');

        // LOAD
        function loadState() {
            const saved = localStorage.getItem('kardon_pro');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    for (let key in state) {
                        if (parsed.hasOwnProperty(key)) state[key] = parsed[key];
                    }
                    if (parsed.currentMode) currentMode = parsed.currentMode;
                } catch (e) {}
            }
        }

        function saveState() {
            const toSave = { ...state, currentMode };
            localStorage.setItem('kardon_pro', JSON.stringify(toSave));
        }

        // RENDER
        function renderInputs() {
            if (currentMode === 'kg') {
                inputsArea.innerHTML = `
                    <div class="input-row">
                        <div class="input-group">
                            <label><span class="label-icon">💰</span> Закуп (за 1 кг)</label>
                            <input type="number" step="0.01" id="kgBuy" placeholder="0.00" value="${state.kgBuy}">
                        </div>
                        <div class="input-group">
                            <label><span class="label-icon">🏷️</span> Продажа (за 1 кг)</label>
                            <input type="number" step="0.01" id="kgSell" placeholder="0.00" value="${state.kgSell}">
                        </div>
                    </div>
                    <div class="input-group">
                        <label><span class="label-icon">⚖️</span> Вес (килограмм)</label>
                        <input type="number" step="0.01" id="kgWeight" placeholder="Например 10" value="${state.kgWeight}">
                    </div>
                `;
            } else {
                inputsArea.innerHTML = `
                    <div class="input-row">
                        <div class="input-group">
                            <label><span class="label-icon">💰</span> Закуп (за 1 шт)</label>
                            <input type="number" step="0.01" id="pcsBuy" placeholder="0.00" value="${state.pcsBuy}">
                        </div>
                        <div class="input-group">
                            <label><span class="label-icon">🏷️</span> Продажа (за 1 шт)</label>
                            <input type="number" step="0.01" id="pcsSell" placeholder="0.00" value="${state.pcsSell}">
                        </div>
                    </div>
                    <div class="input-group">
                        <label><span class="label-icon">📦</span> Количество (штук)</label>
                        <input type="number" step="1" id="pcsCount" placeholder="Например 5" value="${state.pcsCount}">
                    </div>
                `;
            }
            attachEvents();
        }

        function attachEvents() {
            const inputs = inputsArea.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.addEventListener('input', function() {
                    const id = this.id;
                    if (state.hasOwnProperty(id)) {
                        state[id] = this.value;
                        saveState();
                        calculate();
                    }
                });
                inp.addEventListener('blur', function() {
                    const id = this.id;
                    if (state.hasOwnProperty(id)) {
                        state[id] = this.value;
                        saveState();
                        calculate();
                    }
                });
            });
        }

        // CALCULATE
        function calculate() {
            let buyTotal = 0, sellTotal = 0, profit = 0, clientTotal = 0;

            if (currentMode === 'kg') {
                const buy = parseFloat(state.kgBuy) || 0;
                const sell = parseFloat(state.kgSell) || 0;
                const weight = parseFloat(state.kgWeight) || 0;

                buyTotal = buy * weight;
                sellTotal = sell * weight;
                clientTotal = sellTotal;
                profit = sellTotal - buyTotal;
            } else {
                const buy = parseFloat(state.pcsBuy) || 0;
                const sell = parseFloat(state.pcsSell) || 0;
                const count = parseInt(state.pcsCount) || 0;

                buyTotal = buy * count;
                sellTotal = sell * count;
                clientTotal = sellTotal;
                profit = sellTotal - buyTotal;
            }

            elBuyPrice.textContent = buyTotal.toFixed(2);
            elSellPrice.textContent = sellTotal.toFixed(2);

            // Profit color
            if (profit < 0) {
                elProfit.style.color = '#f27d7d';
                elProfit.textContent = profit.toFixed(2);
            } else if (profit === 0) {
                elProfit.style.color = 'rgba(255,255,255,0.3)';
                elProfit.textContent = profit.toFixed(2);
            } else {
                elProfit.style.color = '#4fd8ac';
                elProfit.textContent = profit.toFixed(2);
            }

            elClientTotal.textContent = clientTotal.toFixed(2);
        }

        // SET MODE
        function setMode(mode) {
            currentMode = mode;
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            renderInputs();
            calculate();
            saveState();
        }

        // RESET
        function resetAll() {
            for (let key in state) {
                state[key] = '';
            }
            renderInputs();
            calculate();
            saveState();
        }

        // INIT
        function init() {
            loadState();

            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === currentMode);
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;
                    if (mode !== currentMode) setMode(mode);
                });
            });

            renderInputs();
            calculate();
            resetBtn.addEventListener('click', resetAll);
        }

        init();
    })();
</script>

</body>
</html>
